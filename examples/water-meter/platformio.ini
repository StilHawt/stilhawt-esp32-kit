;  stilhawt-esp32-kit — water meter (TTGO T-Display). Configure src/zdt_device.h first.
[env:water-meter]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@^2.5
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
build_flags =
    -I../../lib
    -DFW_NAME='"water-meter"'
    -DFW_VERSION='"0.6.5"'
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSPI_FREQUENCY=40000000
    -DBTN_SWITCH=35
    -DPIN_OUT1=27
    -DPIN_OUT2=25
    -DPULSE_WEIGHT_L=1
