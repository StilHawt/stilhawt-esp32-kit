;  stilhawt-esp32-kit — BLE scale reader (ESP32). Configure src/zdt_device.h first.
[env:etekcity-scale]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
    h2zero/NimBLE-Arduino@^1.4
build_flags =
    -I../../lib
    -DFW_NAME='"etekcity-scale"'
    -DFW_VERSION='"0.4.4"'
